<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Powers of Ten — scale harness</title>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/": "./node_modules/three/",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --ink: #f2f4f8;
    --dim: #8e97a8;
    --rule: rgba(242, 244, 248, 0.22);
    --bg: #05070b;
    --font: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
  }

  body { display: flex; flex-direction: column; }

  #stage-wrap {
    flex: 1 1 auto;
    display: grid;
    place-items: center;
    min-height: 0;
    padding: 16px;
    container-type: size;
  }

  /* The 4:3 letterbox. The HUD square geometry assumes this aspect, so the
     frame is fitted to the shorter axis rather than being allowed to stretch. */
  #stage {
    position: relative;
    aspect-ratio: 4 / 3;
    width: min(100cqw, calc(100cqh * 4 / 3));
    background: var(--bg);
    overflow: hidden;
  }

  .stage-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- HUD ---- */
  .hud { position: absolute; inset: 0; pointer-events: none; transition: opacity 160ms linear; }
  .hud-hidden { opacity: 0; }
  .hud-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .hud-square-rect { fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .hud-square-ticks { fill: none; stroke: var(--ink); stroke-width: 3.4; }
  /* No font-size here: it is set per square in hud.js and CSS would win. */
  .hud-square-label {
    fill: var(--ink); font-family: var(--font);
    letter-spacing: 0.06em; font-weight: 500;
  }
  .hud-reticle path { fill: none; stroke: var(--ink); stroke-width: 1.6; opacity: 0.6; }

  .readout { position: absolute; font-variant-numeric: tabular-nums; line-height: 1.32; }
  .readout-tl { top: 3.2%; left: 3.4%; }
  .readout-bl { bottom: 7.5%; left: 3.4%; }
  .readout-br { bottom: 7.5%; right: 3.4%; text-align: right; }

  .readout-key {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 6px;
  }
  .readout-power { font-size: 40px; font-weight: 300; letter-spacing: 0.01em; line-height: 1.05; }
  .readout-power sup { font-size: 0.52em; vertical-align: super; font-weight: 400; }
  .readout-unit { font-size: 0.52em; color: var(--dim); margin-left: 2px; }
  .readout-line { font-size: 16px; font-weight: 300; letter-spacing: 0.04em; }
  .readout-dim { color: var(--dim); font-size: 13px; letter-spacing: 0.12em; }

  .progress {
    position: absolute; left: 3.4%; right: 3.4%; bottom: 3.6%;
    height: 1px; background: var(--rule);
  }
  .progress-fill { height: 100%; width: 0; background: var(--ink); }

  /* ---- debug controls ---- */
  #controls {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    background: #0a0d13;
    font-size: 12px; letter-spacing: 0.04em;
    flex-wrap: wrap;
  }
  #controls.hidden { display: none; }
  #controls label { color: var(--dim); text-transform: uppercase; letter-spacing: 0.14em; font-size: 10px; }
  #controls button {
    font-family: var(--font); font-size: 12px; letter-spacing: 0.08em;
    background: #161b24; color: var(--ink); border: 1px solid #262d3a;
    padding: 6px 12px; cursor: pointer;
  }
  #controls button:hover { background: #1f2531; }
  #controls input[type="range"] { accent-color: #e9edf5; }
  #time-range { flex: 1 1 220px; min-width: 160px; }
  #scale-range { flex: 1 1 220px; min-width: 160px; }
  .group { display: flex; align-items: center; gap: 8px; }
  .mono { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 7ch; display: inline-block; }
  .hint { color: #5c6578; margin-left: auto; }
</style>
</head>
<body>
  <div id="stage-wrap"><div id="stage"></div></div>

  <div id="controls">
    <button id="play">▶ Play</button>
    <button id="reset">Reset</button>
    <div class="group" style="flex:1 1 240px">
      <label for="time-range">Time</label>
      <input id="time-range" type="range" min="0" max="428" step="0.1" value="0" />
      <span class="mono" id="time-out">00:00</span>
    </div>
    <div class="group" style="flex:1 1 240px">
      <label for="scale-range">Scale 10^</label>
      <input id="scale-range" type="range" min="-16" max="24" step="0.01" value="0" />
      <span class="mono" id="scale-out">0.00</span>
    </div>
    <div class="group">
      <button id="dec-down">−10×</button>
      <button id="dec-up">+10×</button>
    </div>
    <div class="group">
      <button id="toggle-hud">HUD</button>
      <button id="sound">Sound</button>
      <button id="film">Film</button>
      <span class="mono" id="live-out">0 live</span>
    </div>
    <span class="hint">space play · ←→ scrub · [ ] decade · h hud · m mute · f film · c controls · r reset</span>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
